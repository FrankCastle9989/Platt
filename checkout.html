<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Finalizar Pedido</title>

  <!-- Hoja de estilos del Navbar Global -->
  <link rel="stylesheet" href="navbar.css">

  <!-- CDN de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
    }

    .checkout-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: var(--primary-color);
      margin-bottom: 5px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary-color);
    }

    .input-geo-group {
      display: flex;
      gap: 8px;
    }

    .btn-geo {
      background-color: #fff3e0;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-geo:hover {
      background-color: #ffe0b2;
    }

    /* Resumen de Compra */
    .resumen-box {
      background-color: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .resumen-box h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--gray-light);
      padding-bottom: 5px;
    }

    .items-lista {
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--gray-light);
      padding-bottom: 10px;
    }

    .item-fila {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      margin-bottom: 6px;
      color: #444;
    }

    .resumen-linea {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .resumen-total {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 2px solid var(--gray-light);
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .info-banco-box {
      background-color: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: #2e7d32;
      display: none;
    }

    .btn-submit {
      width: 100%;
      background-color: #25d366; /* Verde WhatsApp */
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #1eb954;
    }

    .info-distancia {
      color: #666;
      font-size: 0.8rem;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>

<!-- Contenedor del Navbar Modular -->
<div id="navbar-container"></div>

<div class="page-wrapper">
  <div class="checkout-card">
    <h2>Confirmar Pedido</h2>
    <p class="subtitle">Ingresa tus datos de entrega para calcular el envío exacto</p>

    <form id="formCheckout" onsubmit="enviarPedidoWhatsApp(event)">
      <div class="form-group">
        <label for="clienteNombre">Nombre Completo *</label>
        <input type="text" id="clienteNombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="clienteTelefono">Teléfono de Contacto *</label>
        <input type="tel" id="clienteTelefono" placeholder="10 dígitos (Ej. 8112345678)" required>
      </div>

      <div class="form-group">
        <label for="clienteDireccion">Dirección de Entrega *</label>
        <div class="input-geo-group">
          <input type="text" id="clienteDireccion" placeholder="Calle, Número y Colonia" required>
          <button type="button" id="btnGeolocalizacion" class="btn-geo" onclick="obtenerUbicacionUsuario()">
            📍 Usar mi ubicación
          </button>
        </div>
        <small id="distanciaInfo" class="info-distancia"></small>
      </div>

      <!-- Método de Pago -->
      <div class="form-group">
        <label for="metodoPago">Método de Pago *</label>
        <select id="metodoPago" onchange="cambiarMetodoPago()" required>
          <option value="efectivo">💵 Efectivo (Al recibir)</option>
          <option value="transferencia">🏦 Transferencia Bancaria (SPEI)</option>
        </select>
      </div>

      <!-- Campo adicional para cambio en efectivo -->
      <div class="form-group" id="divPagoEfectivo">
        <label for="pagoCon">¿Con cuánto dinero vas a pagar?</label>
        <input type="text" id="pagoCon" placeholder="Ej. $500 MXN o Cambio exacto">
      </div>

      <!-- Cuadro informativo de cuenta bancaria si elige transferencia -->
      <div class="info-banco-box" id="divPagoTransferencia">
        <strong>Datos para transferencia:</strong><br>
        <span id="txtBanco">Banco: Por confirmar con el restaurante</span><br>
        <span id="txtClabe">CLABE: Por confirmar con el restaurante</span>
      </div>

      <div class="form-group" style="margin-top: 18px;">
        <label for="clienteNotas">Notas adicionales para la cocina o repartidor</label>
        <textarea id="clienteNotas" rows="2" placeholder="Ej. Sin cebolla / Sin timbre, llamar al llegar"></textarea>
      </div>

      <!-- Resumen de Costos -->
      <div class="resumen-box">
        <h3>Resumen de la Orden</h3>
        <div class="items-lista" id="contenedorItems">
          <!-- Se cargan dinámicamente los productos -->
        </div>

        <div class="resumen-linea">
          <span>Subtotal de productos:</span>
          <strong id="lblSubtotal">$0.00 MXN</strong>
        </div>
        <div class="resumen-linea">
          <span>Costo de envío:</span>
          <strong id="lblCostoEnvio">$30.00 MXN</strong>
        </div>
        <div class="resumen-total">
          <span>Total a Pagar:</span>
          <strong id="lblTotal">$0.00 MXN</strong>
        </div>
      </div>

      <button type="submit" class="btn-submit">📱 Confirmar y Enviar por WhatsApp</button>
    </form>
  </div>
</div>

<!-- Script del Navbar Global -->
<script src="navbar.js"></script>

<!-- Lógica del Checkout y Cálculo de Envío -->
<script>
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Variables de Estado del Pedido
  let negocioLat = 25.6866; // Coordenada default (Monterrey, NL)
  let negocioLon = -100.3161;
  let negocioWhatsapp = "";
  let subtotalProductos = 0;
  let costoEnvioCalculado = 30; // Tarifa base inicial
  let orderData = null;

  window.onload = async function() {
    cargarOrdenLocalStorage();
    await obtenerCoordenadasRestaurante();
    actualizarTotales();
  };

  function cargarOrdenLocalStorage() {
    const rawOrder = localStorage.getItem("platt_current_order");
    
    if (!rawOrder) {
      alert("No se encontró ningún pedido activo. Serás redirigido al inicio.");
      window.location.href = "index.html";
      return;
    }

    orderData = JSON.parse(rawOrder);
    negocioWhatsapp = orderData.whatsappPhone || "";

    // Configurar información de transferencia si la hubiese
    if (orderData.banco) document.getElementById('txtBanco').innerText = `Banco: ${orderData.banco}`;
    if (orderData.clabe) document.getElementById('txtClabe').innerText = `CLABE: ${orderData.clabe}`;

    // Desglosar Ítems y Calcular Subtotal
    const contenedor = document.getElementById('contenedorItems');
    contenedor.innerHTML = "";
    subtotalProductos = 0;

    if (orderData.items && orderData.items.length > 0) {
      orderData.items.forEach(item => {
        const itemSubtotal = item.price * item.qty;
        subtotalProductos += itemSubtotal;

        const fila = document.createElement('div');
        fila.className = 'item-fila';
        fila.innerHTML = `
          <span>${item.qty}x ${item.name}</span>
          <strong>$${itemSubtotal.toFixed(2)} MXN</strong>
        `;
        contenedor.appendChild(fila);
      });
    } else {
      contenedor.innerHTML = "<p style='color:#888;'>No hay productos en el pedido.</p>";
    }
  }

  async function obtenerCoordenadasRestaurante() {
    if (!orderData || !orderData.restauranteId) return;

    try {
      const { data, error } = await _supabase
        .from('restaurantes')
        .select('latitud, longitud, whatsapp')
        .eq('id', orderData.restauranteId)
        .single();

      if (data) {
        if (data.latitud && data.longitud) {
          negocioLat = parseFloat(data.latitud);
          negocioLon = parseFloat(data.longitud);
        }
        if (!negocioWhatsapp && data.whatsapp) {
          negocioWhatsapp = data.whatsapp.replace(/\D/g, '');
          if (negocioWhatsapp.length === 10) negocioWhatsapp = '52' + negocioWhatsapp;
        }
      }
    } catch (err) {
      console.warn("Error cargando ubicación del negocio:", err);
    }
  }

  // --- 1. MÉTODOS DE PAGO Y VISIBILIDAD ---

  function cambiarMetodoPago() {
    const metodo = document.getElementById('metodoPago').value;
    const divEfectivo = document.getElementById('divPagoEfectivo');
    const divTransf = document.getElementById('divPagoTransferencia');

    if (metodo === 'efectivo') {
      divEfectivo.style.display = 'block';
      divTransf.style.display = 'none';
    } else {
      divEfectivo.style.display = 'none';
      divTransf.style.display = 'block';
    }
  }

  // --- 2. CÁLCULO DE DISTANCIA Y ENVÍO ---

  function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
    const R = 6371; // Radio de la Tierra en km
    const dLat = (lat2 - lat1) * (Math.PI / 180);
    const dLon = (lon2 - lon1) * (Math.PI / 180);
    
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
      
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function calcularCostoEnvio(distanciaKm) {
    const tarifaBase = 30;
    const costoKmExtra = 15;

    if (distanciaKm <= 2) {
      return tarifaBase;
    } else {
      const kmExtra = distanciaKm - 2;
      return tarifaBase + (kmExtra * costoKmExtra);
    }
  }

  function obtenerUbicacionUsuario() {
    const btn = document.getElementById('btnGeolocalizacion');
    const infoText = document.getElementById('distanciaInfo');

    if (!navigator.geolocation) {
      alert("Tu navegador no soporta geolocalización.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Geolocalizando...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        const distancia = calcularDistanciaKm(negocioLat, negocioLon, userLat, userLon);
        costoEnvioCalculado = Math.round(calcularCostoEnvio(distancia));

        document.getElementById('clienteDireccion').value = `Ubicación GPS (${userLat.toFixed(5)}, ${userLon.toFixed(5)})`;
        infoText.innerText = `📏 Distancia aprox: ${distancia.toFixed(2)} km. Envío: $${costoEnvioCalculado} MXN`;

        actualizarTotales();

        btn.disabled = false;
        btn.innerText = "📍 Ubicación Obtenida";
      },
      (error) => {
        console.error("Error obteniendo ubicación:", error);
        alert("No se pudo obtener la ubicación automáticamente.");
        btn.disabled = false;
        btn.innerText = "📍 Usar mi ubicación";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function actualizarTotales() {
    const total = subtotalProductos + costoEnvioCalculado;
    
    document.getElementById('lblSubtotal').innerText = `$${subtotalProductos.toFixed(2)} MXN`;
    document.getElementById('lblCostoEnvio').innerText = `$${costoEnvioCalculado.toFixed(2)} MXN`;
    document.getElementById('lblTotal').innerText = `$${total.toFixed(2)} MXN`;
  }

  // --- 3. ENVÍO DE ORDEN POR WHATSAPP ---

// --- 3. ENVÍO DE ORDEN POR WHATSAPP ---

  function enviarPedidoWhatsApp(e) {
    e.preventDefault();

    const nombre = document.getElementById('clienteNombre').value.trim();
    const telefono = document.getElementById('clienteTelefono').value.trim();
    const direccion = document.getElementById('clienteDireccion').value.trim();
    const metodoPago = document.getElementById('metodoPago').value;
    const pagoCon = document.getElementById('pagoCon').value.trim();
    const notas = document.getElementById('clienteNotas').value.trim();
    const total = subtotalProductos + costoEnvioCalculado;

    if (!negocioWhatsapp) {
      alert("El restaurante no tiene un número de WhatsApp asignado.");
      return;
    }

    // Asegurar que el número no contenga el signo '+' ni espacios/guiones
    const numLimpio = negocioWhatsapp.toString().replace(/\D/g, '');

    // Construir mensaje detallado para WhatsApp
    let mensaje = `*¡Nuevo Pedido - Platt!* 🍕\n\n`;
    mensaje += `*Restaurante:* ${orderData.restauranteNombre || ''}\n`;
    mensaje += `*Cliente:* ${nombre}\n`;
    mensaje += `*Teléfono:* ${telefono}\n`;
    mensaje += `*Dirección:* ${direccion}\n\n`;

    mensaje += `*--- Detalle del Pedido ---*\n`;
    if (orderData.items && orderData.items.length > 0) {
      orderData.items.forEach(item => {
        mensaje += `• ${item.qty}x ${item.name} - $${(item.price * item.qty).toFixed(2)} MXN\n`;
      });
    }

    mensaje += `\n*Subtotal:* $${subtotalProductos.toFixed(2)} MXN\n`;
    mensaje += `*Envío:* $${costoEnvioCalculado.toFixed(2)} MXN\n`;
    mensaje += `*TOTAL A PAGAR:* $${total.toFixed(2)} MXN\n\n`;

    mensaje += `*Método de Pago:* ${metodoPago === 'efectivo' ? '💵 Efectivo' : '🏦 Transferencia (SPEI)'}\n`;
    if (metodoPago === 'efectivo' && pagoCon) {
      mensaje += `*Paga con:* ${pagoCon}\n`;
    }

    if (notas) {
      mensaje += `*Notas:* ${notas}\n`;
    }

    // Enlace universal compatible con redes corporativas y bloqueadores
    const url = `https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`;
    
    // Abrir directamente en el navegador
    window.location.href = url;
  }
</script>

</body>
</html>
