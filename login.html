<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Iniciar Sesión</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
      --error-color: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 30px 25px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-container h1 {
      color: var(--primary-color);
      font-size: 2rem;
      letter-spacing: -0.5px;
    }

    .logo-container p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .alert-error {
      background-color: #ffebee;
      color: var(--error-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }

    .register-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-container">
    <h1>Platt</h1>
    <p>Accede a la administración de tu restaurante</p>
  </div>

  <div class="alert-error" id="errorMessage"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="email">Correo Electrónico *</label>
      <input type="email" id="email" placeholder="ejemplo@restaurante.com" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Iniciar Sesión</button>
  </form>

  <div class="register-link">
    ¿Aún no tienes cuenta? <a href="registro-restaurante.html">Regístrate aquí</a>
  </div>
</div>

<script>
  // Inicialización de Supabase con tus credenciales
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redirigir si ya existe una sesión activa
  window.onload = async function() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
      window.location.href = "dashboard-restaurante.html";
    }
  };

  async function handleLogin(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerText = "Verificando...";

    // Autenticación con Supabase Auth
    const { data, error } = await _supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      errorMsg.innerText = "Correo o contraseña incorrectos.";
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = "Iniciar Sesión";
      return;
    }

    // Buscar el ID del restaurante correspondiente al usuario logueado
    const user = data.user;
    const { data: restData, error: restError } = await _supabase
      .from('restaurantes')
      .select('id')
      .eq('user_id', user.id)
      .single();

    if (restData) {
      localStorage.setItem("platt_restaurante_id", restData.id);
    }

    // Redirigir al dashboard
    window.location.href = "dashboard-restaurante.html";
  }
</script>

</body>
</html>
