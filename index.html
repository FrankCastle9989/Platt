<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Descubre Platillos y Restaurantes</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* --- Barra de Navegación Limpia y Moderna --- */
    .main-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 20px;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ff5722;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      text-decoration: none;
      color: #212529;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: #ff5722;
    }

    /* Dropdown para Restaurantes */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-btn {
      background: #ff5722;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .dropdown-btn:hover {
      background: #e64a19;
    }

    .dropdown-btn .arrow {
      font-size: 0.75rem;
      transition: transform 0.2s ease;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      background-color: #ffffff;
      min-width: 200px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      border: 1px solid #e9ecef;
      overflow: hidden;
      z-index: 1001;
    }

    .dropdown-content a {
      color: #212529;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .dropdown-content a:hover {
      background-color: #fff3e0;
      color: #ff5722;
    }

    .dropdown-content.show {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --gray-light: #e9ecef;
      --gray-text: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
      display: flex;
      justify-content: center;
    }

    .main-container {
      width: 100%;
      max-width: 650px;
      padding: 15px;
    }

    /* Navbar / Header de Marca */
    .app-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      margin-bottom: 10px;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-color);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .btn-partner {
      background-color: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-partner:hover {
      background-color: var(--primary-color);
      color: white;
    }

    /* Hero Search Box */
    .hero-search-box {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      border-radius: 16px;
      padding: 25px 20px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.2);
    }

    .hero-search-box h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .hero-search-box p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* Chips de Categorías */
    .categories-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }

    .categories-wrapper::-webkit-scrollbar {
      display: none;
    }

    .chip-cat {
      background: #fff;
      border: 1px solid var(--gray-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray-text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip-cat.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* Grid / Lista de Platillos */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .results-header h2 {
      font-size: 1.1rem;
    }

    .dish-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--gray-light);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }

    .dish-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .dish-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dish-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .dish-title {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .dish-price {
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .dish-description {
      font-size: 0.85rem;
      color: var(--gray-text);
    }

    .restaurant-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
      margin-top: 5px;
    }

    .restaurant-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
    }

    .btn-view-menu {
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-text);
    }
  </style>
</head>
<body>

<div class="main-container">
  <!-- Navbar Top -->
<!-- Encabezado / Barra de Navegación Principal -->
<header class="main-navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">Platt</a>

    <nav class="nav-menu">
<!-- Desplegable Soy Restaurante -->
      <div class="dropdown">
        <button class="dropdown-btn" onclick="toggleDropdown(event)">
          Menú <span class="arrow">▾</span>
        </button>
        <div class="dropdown-content" id="restaurantDropdown">
          <a href="nosotros.html" class="nav-link">Nosotros</a>
          <a href="login.html">Iniciar Sesión</a>
          <a href="nosotros.html#pricing-restaurante">Precios</a>
          <a href="registro-restaurante.html">Registrar mi restaurante</a>
        </div>
      </div>
    </nav>
  </div>
</header>

  <!-- Buscador Hero -->
  <div class="hero-search-box">
    <h1>¿Qué se te antoja hoy?</h1>
    <p>Explora platillos y restaurantes locales registrados en Platt.</p>
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por platillo, categoría o restaurante..." oninput="filterItems()">
    </div>
  </div>

  <!-- Filtro por Categorías -->
  <div class="categories-wrapper" id="categoriesContainer">
    <button class="chip-cat active" onclick="selectCategory('Todas', this)">Todas</button>
  </div>

  <!-- Contenedor de Resultados -->
  <div class="results-header">
    <h2>Platillos Disponibles (<span id="totalDishes">0</span>)</h2>
  </div>

  <div id="dishesList">
    <div class="empty-state">Cargando la oferta gastronómica...</div>
  </div>
</div>

<script>
  // Manejo del menú desplegable de Restaurante
function toggleDropdown(event) {
  event.stopPropagation();
  const dropdown = document.getElementById("restaurantDropdown");
  dropdown.classList.toggle("show");
}

// Cerrar el menú si el usuario hace clic fuera de él
window.addEventListener("click", function(e) {
  const dropdown = document.getElementById("restaurantDropdown");
  if (dropdown && dropdown.classList.contains("show")) {
    dropdown.classList.remove("show");
  }
});
  // Conexión con Supabase
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allDishes = [];
  let selectedCategory = 'Todas';

  window.onload = function() {
    fetchDirectoryData();
  };

  // Consultar Platillos y Restaurantes con JOIN (Incluyendo imagen_url)
  async function fetchDirectoryData() {
    const { data, error } = await _supabase
      .from('platillos')
      .select(`
        id,
        nombre,
        precio,
        descripcion,
        categoria,
        imagen_url,
        disponible,
        restaurantes (
          id,
          nombre,
          direccion
        )
      `)
      .eq('disponible', true);

    if (error) {
      console.error("Error al cargar datos:", error);
      document.getElementById('dishesList').innerHTML = `<div class="empty-state">Error al cargar el directorio.</div>`;
      return;
    }

    allDishes = data || [];
    renderCategories();
    renderDishes();
  }

  // Generar Chips de Categorías
  function renderCategories() {
    const container = document.getElementById('categoriesContainer');
    const categoriesSet = new Set();

    allDishes.forEach(d => {
      if (d.categoria && d.categoria.trim() !== "") {
        const cleanCat = d.categoria.trim();
        categoriesSet.add(cleanCat);
      }
    });

    container.innerHTML = '<button class="chip-cat active" onclick="selectCategory(\'Todas\', this)">Todas</button>';

    categoriesSet.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'chip-cat';
      btn.innerText = cat;
      btn.onclick = () => selectCategory(cat, btn);
      container.appendChild(btn);
    });
  }

  // Seleccionar Categoría
  function selectCategory(cat, element) {
    selectedCategory = cat;
    document.querySelectorAll('.chip-cat').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    filterItems();
  }

  // Filtrar platillos por búsqueda o categorías
  function filterItems() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const catTarget = selectedCategory.toLowerCase().trim();

    const filtered = allDishes.filter(dish => {
      const dishCat = (dish.categoria || '').toLowerCase().trim();
      const dishName = (dish.nombre || '').toLowerCase().trim();
      const dishDesc = (dish.descripcion || '').toLowerCase().trim();
      const restName = (dish.restaurantes?.nombre || '').toLowerCase().trim();

      const matchesCategory = selectedCategory === 'Todas' || 
                              dishCat === catTarget || 
                              dishName.includes(catTarget) ||
                              dishCat.includes(catTarget);

      const matchesSearch = dishName.includes(query) || dishDesc.includes(query) || restName.includes(query) || dishCat.includes(query);

      return matchesCategory && matchesSearch;
    });

    renderDishes(filtered);
  }

  // Renderizar Tarjetas en el DOM (Único bucle)
  function renderDishes(dishesToRender = allDishes) {
    const container = document.getElementById('dishesList');
    document.getElementById('totalDishes').innerText = dishesToRender.length;

    container.innerHTML = "";

    if (dishesToRender.length === 0) {
      container.innerHTML = `<div class="empty-state">No se encontraron platillos ni restaurantes que coincidan con tu búsqueda.</div>`;
      return;
    }

    dishesToRender.forEach(dish => {
      const rest = dish.restaurantes || {};
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.innerHTML = `
        ${dish.imagen_url ? `<img src="${dish.imagen_url}" alt="${dish.nombre}" class="dish-img">` : ''}
        <div class="dish-body">
          <div class="dish-header-info">
            <div class="dish-title">${dish.nombre}</div>
            <div class="dish-price">$${parseFloat(dish.precio).toFixed(2)} MXN</div>
          </div>
          ${dish.descripcion ? `<div class="dish-description">${dish.descripcion}</div>` : ''}
          <div class="restaurant-tag">
            <div>
              <div class="restaurant-name">📍 ${rest.nombre || 'Restaurante'}</div>
            </div>
            <a href="menu.html?id=${rest.id}" class="btn-view-menu">Ver Menú →</a>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }
</script>

</body>
</html>
