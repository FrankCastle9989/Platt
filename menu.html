<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Menú Digital</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --gray-light: #e9ecef;
      --gray-text: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 90px;
      display: flex;
      justify-content: center;
    }

    .menu-container {
      width: 100%;
      max-width: 600px;
      padding: 15px;
    }

    .restaurant-header {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--gray-light);
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .restaurant-header h1 {
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .restaurant-header p {
      font-size: 0.85rem;
      color: var(--gray-text);
    }

    .category-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 20px 0 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--primary-color);
      display: inline-block;
    }

    .dish-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--gray-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dish-img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .dish-info {
      flex: 1;
    }

    .dish-name {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .dish-desc {
      font-size: 0.8rem;
      color: var(--gray-text);
      margin: 2px 0 4px;
    }

    .dish-price {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 0.9rem;
    }

    .dish-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 10px;
    }

    .btn-counter {
      background: var(--gray-light);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-counter.add {
      background: var(--primary-color);
      color: white;
    }

    .cart-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 570px;
      background: var(--primary-color);
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
      cursor: pointer;
      font-weight: bold;
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="menu-container">
  <div class="restaurant-header">
    <h1 id="restName">Cargando restaurante...</h1>
    <p id="restAddress">Obteniendo ubicación...</p>
  </div>

  <div id="menuBody">
    <p style="text-align: center; color: var(--gray-text);">Cargando platillos del menú...</p>
  </div>
</div>

<div class="cart-bar" id="cartBar" style="display: none;" onclick="sendWhatsAppOrder()">
  <span>🛒 Ver Pedido (<span id="cartCount">0</span>)</span>
  <span id="cartTotal">$0.00 MXN</span>
</div>

<script>
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let restaurantData = null;
  let cart = {};

  window.onload = async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const restaurantId = urlParams.get('id');

    if (!restaurantId) {
      document.getElementById('menuBody').innerHTML = "<p style='text-align:center;'>Falta el ID del restaurante en la URL.</p>";
      return;
    }

    // 1. Cargar Datos del Restaurante
    const { data: rest, error: restErr } = await _supabase
      .from('restaurantes')
      .select('*')
      .eq('id', restaurantId)
      .single();

    if (restErr || !rest) {
      document.getElementById('menuBody').innerHTML = "<p style='text-align:center;'>Restaurante no encontrado.</p>";
      return;
    }

    restaurantData = rest;
    document.getElementById('restName').innerText = rest.nombre;
    document.getElementById('restAddress').innerText = rest.direccion || "Servicio a Domicilio / Mostrador";

    // 2. Cargar Platillos (Asegurando solicitar imagen_url)
    loadMenuDishes(restaurantId);
  };

  async function loadMenuDishes(restaurantId) {
    const { data: dishes, error } = await _supabase
      .from('platillos')
      .select('id, nombre, precio, descripcion, categoria, imagen_url')
      .eq('restaurante_id', restaurantId)
      .eq('disponible', true)
      .order('categoria', { ascending: true });

    const container = document.getElementById('menuBody');
    container.innerHTML = "";

    if (error || !dishes || dishes.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>Este restaurante no tiene platillos disponibles en este momento.</p>";
      return;
    }

    // Agrupar por Categorías
    const categories = {};
    dishes.forEach(d => {
      const cat = d.categoria || 'Otros';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(d);
    });

    // Renderizar Categorías y Platillos
    for (const catName in categories) {
      const catTitle = document.createElement('div');
      catTitle.className = 'category-title';
      catTitle.innerText = catName;
      container.appendChild(catTitle);

      categories[catName].forEach(dish => {
        const card = document.createElement('div');
        card.className = 'dish-card';
        card.innerHTML = `
          ${dish.imagen_url ? `<img src="${dish.imagen_url}" alt="${dish.nombre}" class="dish-img">` : ''}
          <div class="dish-info">
            <div class="dish-name">${dish.nombre}</div>
            <div class="dish-desc">${dish.descripcion || ''}</div>
            <div class="dish-price">$${parseFloat(dish.precio).toFixed(2)} MXN</div>
          </div>
          <div class="dish-counter">
            <button class="btn-counter" onclick="updateQuantity('${dish.id}', '${escapeHtml(dish.nombre)}', ${dish.precio}, -1)">-</button>
            <span id="qty-${dish.id}">0</span>
            <button class="btn-counter add" onclick="updateQuantity('${dish.id}', '${escapeHtml(dish.nombre)}', ${dish.precio}, 1)">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }
  }

  function updateQuantity(id, name, price, change) {
    if (!cart[id]) {
      cart[id] = { name, price, qty: 0 };
    }

    cart[id].qty += change;

    if (cart[id].qty <= 0) {
      delete cart[id];
      document.getElementById(`qty-${id}`).innerText = "0";
    } else {
      document.getElementById(`qty-${id}`).innerText = cart[id].qty;
    }

    renderCartBar();
  }

  function renderCartBar() {
    let totalItems = 0;
    let totalPrice = 0;

    for (const id in cart) {
      totalItems += cart[id].qty;
      totalPrice += cart[id].qty * cart[id].price;
    }

    const cartBar = document.getElementById('cartBar');
    if (totalItems > 0) {
      cartBar.style.display = 'flex';
      document.getElementById('cartCount').innerText = totalItems;
      document.getElementById('cartTotal').innerText = `$${totalPrice.toFixed(2)} MXN`;
    } else {
      cartBar.style.display = 'none';
    }
  }

  function sendWhatsAppOrder() {
    if (!restaurantData || !restaurantData.telefono) {
      alert("El restaurante no tiene un número de WhatsApp registrado.");
      return;
    }

    let text = `¡Hola *${restaurantData.nombre}*! 👋 Quisiera realizar el siguiente pedido a través de *Platt*:\n\n`;
    let total = 0;

    for (const id in cart) {
      const item = cart[id];
      const subtotal = item.qty * item.price;
      total += subtotal;
      text += `• ${item.qty}x ${item.name} ($${subtotal.toFixed(2)})\n`;
    }

    text += `\n*Total a pagar:* $${total.toFixed(2)} MXN`;

    const phone = restaurantData.telefono.replace(/\D/g, '');
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  }

  function escapeHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
