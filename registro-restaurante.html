<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Registro de Restaurante</title>

  <!-- Hoja de estilos del Navbar Global -->
  <link rel="stylesheet" href="navbar.css">

  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
      --error-color: #d32f2f;
      --success-color: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .register-container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 30px 25px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-container h1 {
      color: var(--primary-color);
      font-size: 2rem;
    }

    .logo-container p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .alert-msg {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .alert-error {
      background-color: #ffebee;
      color: var(--error-color);
    }

    .alert-success {
      background-color: #e8f5e9;
      color: var(--success-color);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }

    .login-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="page-wrapper">
  <div class="register-container">
    <div class="logo-container">
      <h1>Platt</h1>
      <p>Crea tu cuenta de restaurante</p>
    </div>

    <div class="alert-msg alert-error" id="errorMessage"></div>
    <div class="alert-msg alert-success" id="successMessage"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="nombreRestaurante">Nombre del Restaurante *</label>
        <input type="text" id="nombreRestaurante" placeholder="Ej. Taquería El Paisa" required>
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp de Pedidos *</label>
        <input type="tel" id="whatsapp" placeholder="Ej. 8112345678" required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input type="email" id="email" placeholder="ejemplo@restaurante.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Crear Cuenta</button>
    </form>

    <div class="login-link">
      ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
  </div>
</div>

<script src="navbar.js"></script>

<script>
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function handleRegister(e) {
    e.preventDefault();

    const nombre = document.getElementById('nombreRestaurante').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const errorMsg = document.getElementById('errorMessage');
    const successMsg = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerText = "Registrando...";

    try {
      // Registrar usuario pasando los datos del restaurante en los metadatos de Auth
      const { data: authData, error: authError } = await _supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            nombre_restaurante: nombre,
            whatsapp: whatsapp,
            direccion: "Por definir"
          }
        }
      });

      if (authError) throw authError;

      // Si inició sesión automáticamente (Opción 1 activa en Supabase)
      if (authData.session && authData.user) {
        // Guardar en la tabla restaurantes
        const { data: restData, error: restError } = await _supabase
          .from('restaurantes')
          .insert([
            {
              user_id: authData.user.id,
              nombre: nombre,
              whatsapp: whatsapp,
              direccion: "Por definir"
            }
          ])
          .select()
          .single();

        if (restError) throw restError;

        if (restData) {
          localStorage.setItem("platt_restaurante_id", restData.id);
        }

        successMsg.innerText = "¡Registro exitoso! Entrando a tu panel...";
        successMsg.style.display = 'block';

        setTimeout(() => {
          window.location.href = "dashboard-restaurante.html";
        }, 1000);

      } else {
        // Si Supabase pide confirmar el correo primero
        successMsg.innerText = "¡Cuenta creada! Por favor revisa tu correo electrónico para confirmarla antes de iniciar sesión.";
        successMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = "Crear Cuenta";
      }

    } catch (err) {
      errorMsg.innerText = err.message || "Ocurrió un error al registrar.";
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = "Crear Cuenta";
    }
  }


</script>

</body>
</html>
