<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Registro de Restaurante</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  /* --- Barra de Navegación Limpia y Moderna --- */
.main-navbar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #e9ecef;
  position: sticky;
  top: 0;
  z-index: 1000;
  padding: 12px 20px;
}

.nav-container {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-logo {
  font-size: 1.6rem;
  font-weight: 800;
  color: #ff5722;
  text-decoration: none;
  letter-spacing: -0.5px;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-link {
  text-decoration: none;
  color: #212529;
  font-weight: 600;
  font-size: 0.95rem;
  transition: color 0.2s;
}

.nav-link:hover {
  color: #ff5722;
}

/* Dropdown para Restaurantes */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-btn {
  background: #ff5722;
  color: #ffffff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s ease, transform 0.1s ease;
}

.dropdown-btn:hover {
  background: #e64a19;
}

.dropdown-btn .arrow {
  font-size: 0.75rem;
  transition: transform 0.2s ease;
}

.dropdown-content {
  display: none;
  position: absolute;
  right: 0;
  top: 110%;
  background-color: #ffffff;
  min-width: 200px;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
  border-radius: 12px;
  border: 1px solid #e9ecef;
  overflow: hidden;
  z-index: 1001;
}

.dropdown-content a {
  color: #212529;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  font-size: 0.88rem;
  font-weight: 500;
  transition: background 0.15s ease, color 0.15s ease;
}

.dropdown-content a:hover {
  background-color: #fff3e0;
  color: #ff5722;
}

.dropdown-content.show {
  display: block;
  animation: fadeIn 0.2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
    :root {
      --primary-color: #ff5722;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .form-container { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { color: var(--primary-color); margin-bottom: 10px; text-align: center; }
    p.subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }

    /* Indicador de Pasos */
    .steps-indicator { display: flex; justify-content: space-between; margin-bottom: 25px; position: relative; }
    .steps-indicator::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--gray-light); z-index: 1; transform: translateY(-50%); }
    .step-node { position: relative; z-index: 2; background: #fff; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gray-light); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; color: #777; }
    .step-node.active { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }

    .form-step { display: none; }
    .form-step.active { display: block; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 0.95rem; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-secondary { background-color: var(--gray-light); color: #333; }
  </style>
</head>
<body>

<div class="form-container">
<header class="main-navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">Platt</a>

    <nav class="nav-menu">
<!-- Desplegable Soy Restaurante -->
      <div class="dropdown">
        <button class="dropdown-btn" onclick="toggleDropdown(event)">
          Menú <span class="arrow">▾</span>
        </button>
        <div class="dropdown-content" id="restaurantDropdown">
          <a href="nosotros.html" class="nav-link">Nosotros</a>
          <a href="login.html">Iniciar Sesión</a>
          <a href="nosotros.html#pricing-restaurante">Precios</a>
          <a href="registro-restaurante.html">Registrar mi restaurante</a>
        </div>
      </div>
    </nav>
  </div>
</header>
  <h2>Registro de Restaurante</h2>
  <p class="subtitle">Configura tu negocio y crea tu cuenta de acceso</p>

  <div class="steps-indicator">
    <div class="step-node active" id="node-1">1</div>
    <div class="step-node" id="node-2">2</div>
    <div class="step-node" id="node-3">3</div>
  </div>

  <form id="formRegistro">
    <!-- PASO 1: Datos Generales -->
    <div class="form-step active" id="step-1">
      <div class="form-group">
        <label for="nombre">Nombre del Restaurante *</label>
        <input type="text" id="nombre" placeholder="Ej. Taquería El Paisa" required>
      </div>
      <div class="form-group">
        <label for="direccion">Dirección o Ciudad *</label>
        <input type="text" id="direccion" placeholder="Ej. Av. Hidalgo #123, Monterrey" required>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-primary" onclick="nextStep(2)">Siguiente ➔</button>
      </div>
    </div>

    <!-- PASO 2: Canal de Pedidos -->
    <div class="form-step" id="step-2">
      <div class="form-group">
        <label for="whatsapp">WhatsApp para recibir pedidos *</label>
        <input type="tel" id="whatsapp" placeholder="10 dígitos (Ej. 8112345678)" required>
        <small style="color: #666; font-size: 0.75rem; display: block; margin-top: 4px;">
          A este número te llegarán los pedidos directamente desde el menú digital.
        </small>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="nextStep(1)">← Atrás</button>
        <button type="button" class="btn btn-primary" onclick="nextStep(3)">Siguiente ➔</button>
      </div>
    </div>

    <!-- PASO 3: Cuenta de Acceso (Email y Password) -->
    <div class="form-step" id="step-3">
      <div class="form-group">
        <label for="email">Correo Electrónico de Acceso *</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="nextStep(2)">← Atrás</button>
        <button type="submit" id="btnSubmit" class="btn btn-primary">🚀 Crear Cuenta y Registrar</button>
      </div>
    </div>
  </form>
</div>

<script>

// Manejo del menú desplegable de Restaurante
function toggleDropdown(event) {
  event.stopPropagation();
  const dropdown = document.getElementById("restaurantDropdown");
  dropdown.classList.toggle("show");
}

// Cerrar el menú si el usuario hace clic fuera de él
window.addEventListener("click", function(e) {
  const dropdown = document.getElementById("restaurantDropdown");
  if (dropdown && dropdown.classList.contains("show")) {
    dropdown.classList.remove("show");
  }
});
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function nextStep(step) {
    if (step === 2 && !document.getElementById('nombre').value.trim()) {
      alert("Por favor ingresa el nombre de tu restaurante.");
      return;
    }
    if (step === 3 && !document.getElementById('whatsapp').value.trim()) {
      alert("Por favor ingresa tu número de WhatsApp.");
      return;
    }

    document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.step-node').forEach(el => el.classList.remove('active'));

    document.getElementById(`step-${step}`).classList.add('active');
    for (let i = 1; i <= step; i++) {
      document.getElementById(`node-${i}`).classList.add('active');
    }
  }

  document.getElementById('formRegistro').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = "Registrando...";

    const nombre = document.getElementById('nombre').value.trim();
    const direccion = document.getElementById('direccion').value.trim();
    const numWhatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    try {
      // 1. Crear el usuario en Supabase Auth
      const { data: authData, error: authError } = await _supabase.auth.signUp({
        email: email,
        password: password
      });

      if (authError) throw authError;

      const newUser = authData.user;
      if (!newUser) throw new Error("No se pudo crear el usuario.");

      // 2. Vincular el negocio con el user_id recién creado y guardar el número en 'whatsapp'
      const { data: restData, error: restError } = await _supabase
        .from('restaurantes')
        .insert([
          {
            user_id: newUser.id,
            nombre: nombre,
            direccion: direccion,
            whatsapp: numWhatsapp
          }
        ])
        .select();

      if (restError) throw restError;

      const restCreado = restData[0];
      localStorage.setItem("platt_restaurante_id", restCreado.id);

      alert("¡Cuenta y restaurante creados con éxito! Redirigiendo a tu Dashboard...");
      window.location.href = "dashboard-restaurante.html";

    } catch (err) {
      console.error("Error al registrar:", err);
      alert("Error en el registro: " + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.innerText = "🚀 Crear Cuenta y Registrar";
    }
  });
</script>

</body>
</html>
