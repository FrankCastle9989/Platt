<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Registrar Restaurante</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      color: var(--primary-color);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #e64a19;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Registrar Restaurante</h2>
  
  <form id="formRegistro">
    <!-- Campo: Nombre -->
    <div class="form-group">
      <label for="nombre">Nombre del Restaurante *</label>
      <input type="text" id="nombre" placeholder="Ej. Taquería El Paisa" required>
    </div>

    <!-- Campo: Dirección -->
    <div class="form-group">
      <label for="direccion">Dirección *</label>
      <input type="text" id="direccion" placeholder="Ej. Av. Hidalgo #123, Centro" required>
    </div>

    <!-- Campo: WhatsApp / Teléfono (Opción A: Coincide el ID 'telefono') -->
    <div class="form-group">
      <label for="telefono">WhatsApp de Contacto *</label>
      <input type="tel" id="telefono" placeholder="10 dígitos (Ej. 8112345678)" required>
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit">Registrar Negocio</button>
  </form>
</div>

<script>
  // Conexión con Supabase
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Integración del envío con coincidencia de IDs
document.getElementById('formRegistro').addEventListener('submit', async function(e) {
  e.preventDefault();

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerText = "Guardando...";

  const nombreRestaurante = document.getElementById('nombre').value.trim();
  const direccionRestaurante = document.getElementById('direccion').value.trim();
  const telefonoWhatsApp = document.getElementById('telefono').value.trim();

  try {
    // Intentar obtener sesión activa
    let { data: { session } } = await _supabase.auth.getSession();
    
    // Si no hay sesión (para pruebas directas sin login)
    let currentUserId = session ? session.user.id : null;

    // Insertar el restaurante con el teléfono
    const { data, error } = await _supabase
      .from('restaurantes')
      .insert([
        {
          ...(currentUserId && { user_id: currentUserId }),
          nombre: nombreRestaurante,
          direccion: direccionRestaurante,
          telefono: telefonoWhatsApp // <-- Se guarda el número ingresado
        }
      ])
      .select();

    if (error) throw error;

    const restauranteCreado = data[0];
    // Guardar ID localmente para pruebas rápidas
    localStorage.setItem("platt_restaurante_id", restauranteCreado.id);

    alert("¡Restaurante registrado con éxito! ID: " + restauranteCreado.id);
    window.location.href = `menu.html?id=${restauranteCreado.id}`;

  } catch (err) {
    console.error("Error al registrar el restaurante:", err);
    alert("Ocurrió un error al registrar: " + (err.message || err));
  } finally {
    btn.disabled = false;
    btn.innerText = "Registrar Negocio";
  }
});
</script>

</body>
</html>
