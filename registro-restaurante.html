<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Registro de Restaurante</title>

  <!-- Hoja de estilos del Navbar Global -->
  <link rel="stylesheet" href="navbar.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-color); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Envoltorio para centrar el formulario debajo del menú */
    .page-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    
    .form-container { 
      background: var(--card-bg); 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 500px; 
    }

    h2 { 
      color: var(--primary-color); 
      margin-bottom: 10px; 
      text-align: center; 
    }

    p.subtitle { 
      text-align: center; 
      color: #666; 
      font-size: 0.9rem; 
      margin-bottom: 20px; 
    }

    /* Indicador de Pasos */
    .steps-indicator { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 25px; 
      position: relative; 
    }

    .steps-indicator::before { 
      content: ''; 
      position: absolute; 
      top: 50%; 
      left: 0; 
      width: 100%; 
      height: 2px; 
      background: var(--gray-light); 
      z-index: 1; 
      transform: translateY(-50%); 
    }

    .step-node { 
      position: relative; 
      z-index: 2; 
      background: #fff; 
      width: 32px; 
      height: 32px; 
      border-radius: 50%; 
      border: 2px solid var(--gray-light); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 0.85rem; 
      color: #777; 
    }

    .step-node.active { 
      border-color: var(--primary-color); 
      background: var(--primary-color); 
      color: #fff; 
    }

    .form-step { display: none; }
    .form-step.active { display: block; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }

    .input-geo-group {
      display: flex;
      gap: 8px;
    }

    .btn-geo {
      background-color: #fff3e0;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-geo:hover {
      background-color: #ffe0b2;
    }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 0.95rem; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-secondary { background-color: var(--gray-light); color: #333; }

    .info-geo {
      font-size: 0.75rem;
      color: #666;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>

<!-- Contenedor Único donde JavaScript inyectará navbar.html -->
<div id="navbar-container"></div>

<div class="page-wrapper">
  <div class="form-container">
    <h2>Registro de Restaurante</h2>
    <p class="subtitle">Configura tu negocio y crea tu cuenta de acceso</p>

    <div class="steps-indicator">
      <div class="step-node active" id="node-1">1</div>
      <div class="step-node" id="node-2">2</div>
      <div class="step-node" id="node-3">3</div>
    </div>

    <form id="formRegistro">
      <!-- PASO 1: Datos Generales y Ubicación -->
      <div class="form-step active" id="step-1">
        <div class="form-group">
          <label for="nombre">Nombre del Restaurante *</label>
          <input type="text" id="nombre" placeholder="Ej. Taquería El Paisa" required>
        </div>

        <div class="form-group">
          <label for="direccion">Dirección Física del Local *</label>
          <div class="input-geo-group">
            <input type="text" id="direccion" placeholder="Ej. Av. Hidalgo #123, Monterrey" required>
            <button type="button" id="btnGeoNegocio" class="btn-geo" onclick="obtenerUbicacionNegocio()">
              📍 Mi ubicación actual
            </button>
          </div>
          <small id="geoStatus" class="info-geo">Presiona el botón mientras estés en el negocio para guardar las coordenadas exactas de envío.</small>
          
          <!-- Campos Ocultos para Guardar Coordenadas -->
          <input type="hidden" id="latitud">
          <input type="hidden" id="longitud">
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-primary" onclick="nextStep(2)">Siguiente ➔</button>
        </div>
      </div>

      <!-- PASO 2: Canal de Pedidos -->
      <div class="form-step" id="step-2">
        <div class="form-group">
          <label for="whatsapp">WhatsApp para recibir pedidos *</label>
          <input type="tel" id="whatsapp" placeholder="10 dígitos (Ej. 8112345678)" required>
          <small style="color: #666; font-size: 0.75rem; display: block; margin-top: 4px;">
            A este número te llegarán los pedidos directamente desde el menú digital.
          </small>
        </div>
        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="nextStep(1)">← Atrás</button>
          <button type="button" class="btn btn-primary" onclick="nextStep(3)">Siguiente ➔</button>
        </div>
      </div>

      <!-- PASO 3: Cuenta de Acceso -->
      <div class="form-step" id="step-3">
        <div class="form-group">
          <label for="email">Correo Electrónico de Acceso *</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="nextStep(2)">← Atrás</button>
          <button type="submit" id="btnSubmit" class="btn btn-primary">🚀 Crear Cuenta y Registrar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Script Global que descarga e inyecta la barra de navegación -->
<script src="navbar.js"></script>

<!-- Script de la lógica de negocio y Supabase -->
<script>
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Función para obtener la ubicación GPS del negocio
  function obtenerUbicacionNegocio() {
    const btn = document.getElementById('btnGeoNegocio');
    const statusText = document.getElementById('geoStatus');

    if (!navigator.geolocation) {
      alert("Tu navegador no soporta geolocalización.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Capturando...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('latitud').value = lat;
        document.getElementById('longitud').value = lon;

        statusText.innerText = `✅ Coordenadas capturadas correctamente (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        statusText.style.color = "#2e7d32"; // Verde

        btn.disabled = false;
        btn.innerText = "📍 Ubicación Capturada";
      },
      (error) => {
        console.error("Error al obtener la ubicación:", error);
        alert("No se pudo obtener la ubicación GPS. Puedes continuar ingresando la dirección manualmente.");
        statusText.innerText = "⚠️ No se obtuvieron coordenadas GPS. Puedes continuar manualmente.";
        statusText.style.color = "#d32f2f"; // Rojo

        btn.disabled = false;
        btn.innerText = "📍 Mi ubicación actual";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function nextStep(step) {
    if (step === 2 && !document.getElementById('nombre').value.trim()) {
      alert("Por favor ingresa el nombre de tu restaurante.");
      return;
    }
    if (step === 3 && !document.getElementById('whatsapp').value.trim()) {
      alert("Por favor ingresa tu número de WhatsApp.");
      return;
    }

    document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.step-node').forEach(el => el.classList.remove('active'));

    document.getElementById(`step-${step}`).classList.add('active');
    for (let i = 1; i <= step; i++) {
      document.getElementById(`node-${i}`).classList.add('active');
    }
  }

  document.getElementById('formRegistro').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = "Registrando...";

    const nombre = document.getElementById('nombre').value.trim();
    const direccion = document.getElementById('direccion').value.trim();
    const latitud = document.getElementById('latitud').value ? parseFloat(document.getElementById('latitud').value) : null;
    const longitud = document.getElementById('longitud').value ? parseFloat(document.getElementById('longitud').value) : null;
    const numWhatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    try {
      // 1. Crear el usuario en Supabase Auth
      const { data: authData, error: authError } = await _supabase.auth.signUp({
        email: email,
        password: password
      });

      if (authError) throw authError;

      const newUser = authData.user;
      if (!newUser) throw new Error("No se pudo crear el usuario.");

      // 2. Vincular el negocio con las coordenadas en la tabla 'restaurantes'
      const { data: restData, error: restError } = await _supabase
        .from('restaurantes')
        .insert([
          {
            user_id: newUser.id,
            nombre: nombre,
            direccion: direccion,
            latitud: latitud,
            longitud: longitud,
            whatsapp: numWhatsapp
          }
        ])
        .select();

      if (restError) throw restError;

      const restCreado = restData[0];
      localStorage.setItem("platt_restaurante_id", restCreado.id);

      alert("¡Cuenta y restaurante creados con éxito! Redirigiendo a tu Dashboard...");
      window.location.href = "dashboard-restaurante.html";

    } catch (err) {
      console.error("Error al registrar:", err);
      alert("Error en el registro: " + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.innerText = "🚀 Crear Cuenta y Registrar";
    }
  });
</script>

</body>
</html>
