<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Dashboard Restaurante</title>

  <!-- Hoja de estilos del Navbar Global -->
  <link rel="stylesheet" href="navbar.css">

  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
      --danger-color: #d32f2f;
      --success-color: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .dashboard-header {
      margin-bottom: 25px;
    }

    .dashboard-header h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 18px;
      color: var(--text-color);
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--gray-light);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary-color);
    }

    .btn-geo {
      background-color: #fff3e0;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-geo:hover {
      background-color: #ffe0b2;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    /* Lista de Platillos */
    .platillos-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    .platillo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #fafafa;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
    }

    .platillo-info h4 {
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .platillo-info p {
      font-size: 0.8rem;
      color: #666;
    }

    .platillo-precio {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 0.95rem;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger-color);
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 10px;
      padding: 4px 8px;
    }

    .info-geo {
      font-size: 0.75rem;
      color: #666;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>

<!-- Contenedor del Navbar Modular -->
<div id="navbar-container"></div>

<div class="page-wrapper">
  <div class="dashboard-header">
    <h1 id="lblNombreRestaurante">Cargando Administrador...</h1>
    <p style="color: #666; font-size: 0.9rem;">Gestiona la información de tu negocio, ubicación y menú digital.</p>
  </div>

  <div class="dashboard-grid">
    <!-- COLUMNA 1: Configuración de Perfil y Dirección -->
    <div class="card">
      <h2>⚙️ Datos del Restaurante</h2>
      <form id="formPerfil" onsubmit="guardarPerfilRestaurante(event)">
        <div class="form-group">
          <label for="dashNombre">Nombre del Restaurante *</label>
          <input type="text" id="dashNombre" required placeholder="Ej. Taquería El Paisa">
        </div>

        <div class="form-group">
          <label for="dashWhatsapp">WhatsApp de Pedidos *</label>
          <input type="tel" id="dashWhatsapp" required placeholder="10 dígitos (Ej. 8112345678)">
        </div>

        <div class="form-group">
          <label for="dashDireccion">Dirección Física del Local *</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="dashDireccion" placeholder="Ej. Av. Hidalgo #123, Monterrey" required style="flex: 1;">
            <button type="button" id="btnGeoDash" onclick="obtenerUbicacionDashboard()" class="btn-geo">
              📍 Usar mi ubicación
            </button>
          </div>
          <small id="dashGeoStatus" class="info-geo">
            Actualiza tu ubicación GPS para que el cálculo automático de envío sea exacto.
          </small>

          <!-- Campos Ocultos de Coordenadas -->
          <input type="hidden" id="dashLatitud">
          <input type="hidden" id="dashLongitud">
        </div>

        <button type="submit" id="btnGuardarPerfil" class="btn-primary" style="margin-top: 10px;">💾 Guardar Cambios de Perfil</button>
      </form>
    </div>

    <!-- COLUMNA 2: Agregar y Gestionar Menú -->
    <div class="card">
      <h2>🍕 Agregar Nuevo Platillo</h2>
      <form id="formPlatillo" onsubmit="agregarPlatillo(event)">
        <div class="form-group">
          <label for="platilloNombre">Nombre del Platillo *</label>
          <input type="text" id="platilloNombre" placeholder="Ej. Tacos al Pastor (Orden de 5)" required>
        </div>

        <div class="form-group">
          <label for="platilloPrecio">Precio ($ MXN) *</label>
          <input type="number" step="0.5" id="platilloPrecio" placeholder="Ej. 85.00" required>
        </div>

        <div class="form-group">
          <label for="platilloDescripcion">Descripción / Ingredientes</label>
          <textarea id="platilloDescripcion" rows="2" placeholder="Ej. Incluye piña, cilantro, cebolla y salsas"></textarea>
        </div>

        <button type="submit" id="btnAgregarPlatillo" class="btn-primary">➕ Guardar Platillo</button>
      </form>

      <h2 style="margin-top: 25px;">📋 Menú Actual</h2>
      <div class="platillos-list" id="listaPlatillos">
        <p style="text-align: center; color: #888; font-size: 0.85rem;">Cargando platillos...</p>
      </div>
    </div>
  </div>
</div>

<!-- Script del Navbar Global -->
<script src="navbar.js"></script>

<script>
  // Inicialización de Supabase
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let restauranteId = null;

  window.onload = async function() {
    restauranteId = localStorage.getItem("platt_restaurante_id");

    // Verificar si hay sesión o ID activo
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session && !restauranteId) {
      window.location.href = "login.html";
      return;
    }

    await cargarPerfilRestaurante();
    await cargarPlatillos();
  };

  // --- 1. CAPTURA DE UBICACIÓN GPS ---
  function obtenerUbicacionDashboard() {
    const btn = document.getElementById('btnGeoDash');
    const statusText = document.getElementById('dashGeoStatus');

    if (!navigator.geolocation) {
      alert("Tu navegador no soporta geolocalización.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Capturando...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('dashLatitud').value = lat;
        document.getElementById('dashLongitud').value = lon;

        statusText.innerText = `✅ Coordenadas GPS capturadas (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        statusText.style.color = "var(--success-color)";

        btn.disabled = false;
        btn.innerText = "📍 Ubicación Capturada";
      },
      (error) => {
        console.error("Error al obtener la ubicación:", error);
        alert("No se pudo obtener la ubicación GPS.");
        statusText.innerText = "⚠️ Error al obtener coordenadas GPS.";
        statusText.style.color = "var(--danger-color)";

        btn.disabled = false;
        btn.innerText = "📍 Usar mi ubicación";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // --- 2. CARGAR PERFIL DE RESTAURANTE ---
  async function cargarPerfilRestaurante() {
    if (!restauranteId) return;

    try {
      const { data, error } = await _supabase
        .from('restaurantes')
        .select('nombre, direccion, latitud, longitud, whatsapp')
        .eq('id', restauranteId)
        .single();

      if (error) throw error;

      if (data) {
        document.getElementById('lblNombreRestaurante').innerText = data.nombre || "Mi Restaurante";
        document.getElementById('dashNombre').value = data.nombre || '';
        document.getElementById('dashWhatsapp').value = data.whatsapp || '';
        document.getElementById('dashDireccion').value = data.direccion || '';

        if (data.latitud && data.longitud) {
          document.getElementById('dashLatitud').value = data.latitud;
          document.getElementById('dashLongitud').value = data.longitud;

          const statusText = document.getElementById('dashGeoStatus');
          statusText.innerText = `📍 Ubicación guardada (${parseFloat(data.latitud).toFixed(4)}, ${parseFloat(data.longitud).toFixed(4)})`;
          statusText.style.color = "var(--success-color)";
        }
      }
    } catch (err) {
      console.error("Error cargando perfil:", err);
    }
  }

  // --- 3. GUARDAR CAMBIOS DE PERFIL Y COORDENADAS ---
  async function guardarPerfilRestaurante(e) {
    e.preventDefault();

    const btn = document.getElementById('btnGuardarPerfil');
    btn.disabled = true;
    btn.innerText = "Guardando...";

    const nombre = document.getElementById('dashNombre').value.trim();
    const direccion = document.getElementById('dashDireccion').value.trim();
    const whatsapp = document.getElementById('dashWhatsapp').value.trim();
    
    const latitudRaw = document.getElementById('dashLatitud').value;
    const longitudRaw = document.getElementById('dashLongitud').value;

    const latitud = latitudRaw ? parseFloat(latitudRaw) : null;
    const longitud = longitudRaw ? parseFloat(longitudRaw) : null;

    try {
      const { error } = await _supabase
        .from('restaurantes')
        .update({
          nombre: nombre,
          direccion: direccion,
          whatsapp: whatsapp,
          latitud: latitud,
          longitud: longitud
        })
        .eq('id', restauranteId);

      if (error) throw error;

      document.getElementById('lblNombreRestaurante').innerText = nombre;
      alert("¡Perfil e información de envío actualizados correctamente!");
    } catch (err) {
      alert("Error al actualizar perfil: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 Guardar Cambios de Perfil";
    }
  }

  // --- 4. GESTIÓN DE PLATILLOS (MENÚ) ---
  async function cargarPlatillos() {
    const contenedor = document.getElementById('listaPlatillos');
    if (!restauranteId) return;

    try {
      const { data, error } = await _supabase
        .from('platillos')
        .select('*')
        .eq('restaurante_id', restauranteId);

      if (error) throw error;

      if (!data || data.length === 0) {
        contenedor.innerHTML = `<p style="text-align: center; color: #888; font-size: 0.85rem;">No has agregado ningún platillo todavía.</p>`;
        return;
      }

      contenedor.innerHTML = data.map(item => `
        <div class="platillo-item">
          <div class="platillo-info">
            <h4>${item.nombre}</h4>
            <p>${item.descripcion || 'Sin descripción'}</p>
          </div>
          <div style="display: flex; align-items: center;">
            <span class="platillo-precio">$${parseFloat(item.precio).toFixed(2)}</span>
            <button class="btn-delete" onclick="eliminarPlatillo('${item.id}')" title="Eliminar Platillo">🗑️</button>
          </div>
        </div>
      `).join('');

    } catch (err) {
      contenedor.innerHTML = `<p style="color: var(--danger-color); font-size: 0.85rem;">Error al cargar platillos.</p>`;
    }
  }

  async function agregarPlatillo(e) {
    e.preventDefault();

    const btn = document.getElementById('btnAgregarPlatillo');
    btn.disabled = true;

    const nombre = document.getElementById('platilloNombre').value.trim();
    const precio = parseFloat(document.getElementById('platilloPrecio').value);
    const descripcion = document.getElementById('platilloDescripcion').value.trim();

    try {
      const { error } = await _supabase
        .from('platillos')
        .insert([
          {
            restaurante_id: restauranteId,
            nombre: nombre,
            precio: precio,
            descripcion: descripcion
          }
        ]);

      if (error) throw error;

      document.getElementById('formPlatillo').reset();
      await cargarPlatillos();
    } catch (err) {
      alert("Error al agregar platillo: " + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function eliminarPlatillo(id) {
    if (!confirm("¿Estás seguro de que deseas eliminar este platillo de tu menú?")) return;

    try {
      const { error } = await _supabase
        .from('platillos')
        .delete()
        .eq('id', id);

      if (error) throw error;

      await cargarPlatillos();
    } catch (err) {
      alert("Error al eliminar platillo: " + err.message);
    }
  }
</script>

</body>
</html>
