<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Dashboard del Restaurante</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- CDN para generación de Código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
      --success-color: #2e7d32;
      --danger-color: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gray-light);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .restaurant-info h2 {
      color: var(--primary-color);
      font-size: 1.4rem;
    }

    .restaurant-info p {
      font-size: 0.85rem;
      color: #666;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-logout {
      background-color: #fff;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background-color: var(--danger-color);
      color: #fff;
    }

    /* Navegación por Pestañas */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--gray-light);
    }

    .tab-btn {
      padding: 10px 15px;
      border: none;
      background: none;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-add {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Lista de Platillos */
    .dish-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .dish-details {
      flex: 1;
      margin-left: 10px;
    }

    .dish-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .dish-desc {
      font-size: 0.8rem;
      color: #666;
    }

    .dish-price {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 0.9rem;
    }

    .dish-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Switch Disponible */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--success-color);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--gray-light);
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Form Grupos Modal */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="restaurant-info">
      <h2 id="restName">Cargando Restaurante...</h2>
      <p id="restAddress">Obteniendo dirección...</p>
    </div>
    <div class="user-actions">
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
    </div>
  </div>

  <div class="tabs-nav">
  <button class="tab-btn active" onclick="switchTab('menu')">Menú y Platillos</button>
  <button class="tab-btn" onclick="switchTab('qr')">Código QR y Enlace</button>
  </div>

  <!-- PESTAÑA 1: GESTIÓN DE MENÚ -->
  <div class="tab-content active" id="tab-menu">
    <div class="section-header">
      <h3>Platillos (<span id="countDishes">0</span>)</h3>
      <button class="btn-add" onclick="openDishModal('add')">+ Agregar Platillo</button>
    </div>

    <div id="dishesList">
      <p style="text-align: center; color: #888; margin-top: 20px;">Cargando platillos de Supabase...</p>
    </div>
  </div>

<!-- PESTAÑA 2: CÓDIGO QR -->
<div class="tab-content" id="tab-qr" style="display: none;">
  <div style="text-align: center; padding: 20px; background: #fafafa; border-radius: 12px; border: 1px solid var(--gray-light);">
    <h3>Tu Código QR de Menú Digital</h3>
    <p style="font-size: 0.85rem; color: #666; margin: 8px 0 20px;">
      Descarga e imprime este código para colocarlo en las mesas o mostrador de tu negocio.
    </p>
    
    <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>
    
    <div class="form-group" style="max-width: 400px; margin: 0 auto 15px;">
      <label>Enlace Directo a tu Menú:</label>
      <input type="text" id="menuUrlInput" readonly style="text-align: center; font-weight: bold; background: #fff;">
    </div>

    <div style="display: flex; gap: 10px; justify-content: center; max-width: 400px; margin: 0 auto;">
      <button class="btn-add" onclick="copyMenuLink()">📋 Copiar Link</button>
      <button class="btn-add" style="background-color: #333;" onclick="window.print()">🖨️ Imprimir QR</button>
    </div>
  </div>
</div>

</div>

<!-- MODAL PARA PLATILLOS -->
<div class="modal-overlay" id="dishModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Agregar Nuevo Platillo</h3>
      <button class="modal-close" onclick="closeDishModal()">✕</button>
    </div>

    <form id="dishForm" onsubmit="saveDish(event)">
      <input type="hidden" id="editDishId">

      <div class="form-group">
        <label for="modalDishName">Nombre del Platillo *</label>
        <input type="text" id="modalDishName" placeholder="Ej. Torta Ahogada" required>
      </div>

      <div class="form-group">
        <label for="modalDishPrice">Precio ($ MXN) *</label>
        <input type="number" id="modalDishPrice" step="0.5" placeholder="85.00" required>
      </div>

      <div class="form-group">
        <label for="modalDishCategory">Categoría</label>
        <div class="form-group">
          <label for="modalDishCategory">Categoría *</label>
          <select id="modalDishCategory" required>
            <option value="">Selecciona una categoría...</option>
            <option value="Tacos">Tacos</option>
            <option value="Hamburguesas">Hamburguesas</option>
            <option value="Tortas y Lonches">Tortas y Lonches</option>
            <option value="Pizzas">Pizzas</option>
            <option value="Sushi y Asiática">Sushi y Asiática</option>
            <option value="Entradas y Botanas">Entradas y Botanas</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Postres">Postres</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="modalDishDesc">Descripción Corta</label>
        <textarea id="modalDishDesc" rows="2" placeholder="Ingredientes o detalles del platillo"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn-icon" style="flex: 1; padding: 10px;" onclick="closeDishModal()">Cancelar</button>
        <button type="submit" id="modalSaveBtn" class="btn-add" style="flex: 1; padding: 10px;">Guardar Platillo</button>
      </div>
    </form>
  </div>
</div>

<script>
  // 1. Conexión con Supabase
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let restaurantId = null;

  // Verificación de Autenticación al cargar la página
  window.onload = async function() {
    const { data: { session } } = await _supabase.auth.getSession();
    
    if (!session) {
      // Si no hay sesión, reorientar al Login
      window.location.href = "login.html";
      return;
    }

    const userId = session.user.id;

    // Buscar el restaurante perteneciente al usuario autenticado
    const { data: restData, error } = await _supabase
      .from('restaurantes')
      .select('*')
      .eq('user_id', userId)
      .single();

    if (restData) {
      restaurantId = restData.id;
      localStorage.setItem("platt_restaurante_id", restaurantId);
      document.getElementById('restName').innerText = restData.nombre;
      document.getElementById('restAddress').innerText = restData.direccion || "Sin dirección registrada";
      loadDishes();
    } else {
      alert("No se encontró un restaurante asociado a esta cuenta.");
    }
  };

  // Cargar Platillos de Supabase
  async function loadDishes() {
    const { data: dishes, error } = await _supabase
      .from('platillos')
      .select('*')
      .eq('restaurante_id', restaurantId)
      .order('creado_en', { ascending: true });

    const container = document.getElementById('dishesList');
    container.innerHTML = "";

    if (!dishes || dishes.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: #888;">Aún no tienes platillos registrados.</p>`;
      document.getElementById('countDishes').innerText = "0";
      return;
    }

    document.getElementById('countDishes').innerText = dishes.length;

    dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-item';
      card.id = `dish-${dish.id}`;
      card.innerHTML = `
        <div class="dish-details">
          <h4 class="dish-title">${dish.nombre}</h4>
          <p class="dish-desc">${dish.descripcion || ''}</p>
          <span class="dish-price">$${parseFloat(dish.precio).toFixed(2)} MXN</span>
        </div>
        <div class="dish-actions">
          <div class="switch-container">
            <span>Disponible</span>
            <label class="switch">
              <input type="checkbox" ${dish.disponible ? 'checked' : ''} onchange="toggleAvailability('${dish.id}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
          <button class="btn-icon" onclick="openDishModal('edit', '${dish.id}', '${escapeHtml(dish.nombre)}', ${dish.precio}, '${escapeHtml(dish.descripcion || '')}', '${escapeHtml(dish.categoria || '')}')">✏️ Editar</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Cambiar disponibilidad en Supabase
  async function toggleAvailability(dishId, isAvailable) {
    await _supabase
      .from('platillos')
      .update({ disponible: isAvailable })
      .eq('id', dishId);
  }

  // Abrir Modal
  function openDishModal(mode, id = null, name = '', price = '', desc = '', cat = '') {
    const modal = document.getElementById('dishModal');
    const title = document.getElementById('modalTitle');

    modal.classList.add('active');

    if (mode === 'add') {
      title.innerText = "Agregar Nuevo Platillo";
      document.getElementById('dishForm').reset();
      document.getElementById('editDishId').value = "";
    } else {
      title.innerText = "Editar Platillo";
      document.getElementById('editDishId').value = id;
      document.getElementById('modalDishName').value = name;
      document.getElementById('modalDishPrice').value = price;
      document.getElementById('modalDishDesc').value = desc;
      document.getElementById('modalDishCategory').value = cat;
    }
  }

  function closeDishModal() {
    document.getElementById('dishModal').classList.remove('active');
  }

  // Guardar Cambios (INSERT / UPDATE)
  async function saveDish(e) {
    e.preventDefault();
    const btn = document.getElementById('modalSaveBtn');
    btn.disabled = true;
    btn.innerText = "Guardando...";

    const id = document.getElementById('editDishId').value;
    const name = document.getElementById('modalDishName').value;
    const price = parseFloat(document.getElementById('modalDishPrice').value);
    const desc = document.getElementById('modalDishDesc').value;
    const cat = document.getElementById('modalDishCategory').value;

    if (id) {
      await _supabase
        .from('platillos')
        .update({
          nombre: name,
          precio: price,
          descripcion: desc,
          categoria: cat
        })
        .eq('id', id);
    } else {
      await _supabase
        .from('platillos')
        .insert([{
          restaurante_id: restaurantId,
          nombre: name,
          precio: price,
          descripcion: desc,
          categoria: cat,
          disponible: true
        }]);
    }

    btn.disabled = false;
    btn.innerText = "Guardar Platillo";
    closeDishModal();
    loadDishes();
  }

  // Cerrar Sesión
  async function handleLogout() {
    await _supabase.auth.signOut();
    localStorage.removeItem("platt_restaurante_id");
    window.location.href = "login.html";
  }

  function escapeHtml(text) {
    return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }


let qrGenerated = false;

// Cambiar de pestaña
function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');

  if (tabName === 'menu') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-menu').style.display = 'block';
  } else if (tabName === 'qr') {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-qr').style.display = 'block';
    generateQRCode();
  }
}

// Generar Código QR Dinámico
async function generateQRCode() {
  const qrContainer = document.getElementById('qrcode');
  const inputUrl = document.getElementById('menuUrlInput');

  // Si no tenemos el ID cargado, intentamos obtenerlo de nuevo desde la sesión de Supabase
  if (!restaurantId) {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
      const { data: restData } = await _supabase
        .from('restaurantes')
        .select('id')
        .eq('user_id', session.user.id)
        .single();
      
      if (restData) {
        restaurantId = restData.id;
      }
    }
  }

  // Si aun así no hay ID, mostramos aviso
  if (!restaurantId) {
    qrContainer.innerHTML = "<p style='color:red;'>No se pudo obtener el ID del restaurante. Por favor recarga la página.</p>";
    return;
  }

  // Construir la URL completa asegurando que apunte a menu.html con el ID correspondiente
  const currentPath = window.location.pathname;
  const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
  const menuUrl = `${window.location.origin}${basePath}/menu.html?id=${restaurantId}`;

  inputUrl.value = menuUrl;

  // Limpiar e insertar QR
  qrContainer.innerHTML = "";
  new QRCode(qrContainer, {
    text: menuUrl,
    width: 200,
    height: 200,
    colorDark: "#ff5722",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  qrGenerated = true;
}
// Copiar Link al portapapeles
function copyMenuLink() {
  const copyText = document.getElementById("menuUrlInput");
  copyText.select();
  document.execCommand("copy");
  alert("¡Enlace copiado al portapapeles!");
}

</script>

</body>
</html>
