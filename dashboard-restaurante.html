<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platt - Dashboard del Restaurante</title>
  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #ff5722;
      --primary-hover: #e64a19;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --gray-light: #e0e0e0;
      --success-color: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gray-light);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .restaurant-info h2 {
      color: var(--primary-color);
      font-size: 1.4rem;
    }

    .restaurant-info p {
      font-size: 0.85rem;
      color: #666;
    }

    /* Navegación por Pestañas */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--gray-light);
    }

    .tab-btn {
      padding: 10px 15px;
      border: none;
      background: none;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-add {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Lista de Platillos */
    .dish-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .dish-details {
      flex: 1;
      margin-left: 10px;
    }

    .dish-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .dish-desc {
      font-size: 0.8rem;
      color: #666;
    }

    .dish-price {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 0.9rem;
    }

    .dish-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Switch Disponible */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--success-color);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--gray-light);
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Form Grupos Modal */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="restaurant-info">
      <h2 id="restName">Cargando Restaurante...</h2>
      <p id="restAddress">Obteniendo dirección...</p>
    </div>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('tab-menu', this)">Menú y Platillos</button>
  </div>

  <!-- PESTAÑA 1: GESTIÓN DE MENÚ -->
  <div class="tab-content active" id="tab-menu">
    <div class="section-header">
      <h3>Platillos (<span id="countDishes">0</span>)</h3>
      <button class="btn-add" onclick="openDishModal('add')">+ Agregar Platillo</button>
    </div>

    <div id="dishesList">
      <p style="text-align: center; color: #888; margin-top: 20px;">Cargando platillos de Supabase...</p>
    </div>
  </div>
</div>

<!-- MODAL PARA PLATILLOS -->
<div class="modal-overlay" id="dishModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Agregar Nuevo Platillo</h3>
      <button class="modal-close" onclick="closeDishModal()">✕</button>
    </div>

    <form id="dishForm" onsubmit="saveDish(event)">
      <input type="hidden" id="editDishId">

      <div class="form-group">
        <label for="modalDishName">Nombre del Platillo *</label>
        <input type="text" id="modalDishName" placeholder="Ej. Torta Ahogada" required>
      </div>

      <div class="form-group">
        <label for="modalDishPrice">Precio ($ MXN) *</label>
        <input type="number" id="modalDishPrice" step="0.5" placeholder="85.00" required>
      </div>

      <div class="form-group">
        <label for="modalDishCategory">Categoría</label>
        <input type="text" id="modalDishCategory" placeholder="Ej. Entradas, Bebidas, Fuertes">
      </div>

      <div class="form-group">
        <label for="modalDishDesc">Descripción Corta</label>
        <textarea id="modalDishDesc" rows="2" placeholder="Ingredientes o detalles del platillo"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn-icon" style="flex: 1; padding: 10px;" onclick="closeDishModal()">Cancelar</button>
        <button type="submit" id="modalSaveBtn" class="btn-add" style="flex: 1; padding: 10px;">Guardar Platillo</button>
      </div>
    </form>
  </div>
</div>

<script>
  // 1. Conexión con Supabase
  const SUPABASE_URL = "https://dfunaefzrkjodyawjflw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdW5hZWZ6cmtqb2R5YXdqZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTM0MjIsImV4cCI6MjEwNTUyOTQyMn0.9WfEPYPyUKxvxMp1YHrdJ0F2VhuwnZpFqJb0v3dnax0";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let restaurantId = localStorage.getItem("platt_restaurante_id");

  window.onload = async function() {
    if (!restaurantId) {
      // Si no hay ID en localStorage, obtenemos el primer restaurante disponible
      const { data } = await _supabase.from('restaurantes').select('id').limit(1);
      if (data && data.length > 0) {
        restaurantId = data[0].id;
        localStorage.setItem("platt_restaurante_id", restaurantId);
      } else {
        alert("No se encontró ningún restaurante registrado.");
        return;
      }
    }
    loadRestaurantData();
    loadDishes();
  };

  // Cargar datos del Restaurante
  async function loadRestaurantData() {
    const { data, error } = await _supabase
      .from('restaurantes')
      .select('*')
      .eq('id', restaurantId)
      .single();

    if (data) {
      document.getElementById('restName').innerText = data.nombre;
      document.getElementById('restAddress').innerText = data.direccion || "Sin dirección registrada";
    }
  }

  // Cargar Platillos desde Supabase
  async function loadDishes() {
    const { data: dishes, error } = await _supabase
      .from('platillos')
      .select('*')
      .eq('restaurante_id', restaurantId)
      .order('creado_en', { ascending: true });

    const container = document.getElementById('dishesList');
    container.innerHTML = "";

    if (!dishes || dishes.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: #888;">Aún no tienes platillos registrados.</p>`;
      document.getElementById('countDishes').innerText = "0";
      return;
    }

    document.getElementById('countDishes').innerText = dishes.length;

    dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-item';
      card.id = `dish-${dish.id}`;
      card.innerHTML = `
        <div class="dish-details">
          <h4 class="dish-title">${dish.nombre}</h4>
          <p class="dish-desc">${dish.descripcion || ''}</p>
          <span class="dish-price">$${parseFloat(dish.precio).toFixed(2)} MXN</span>
        </div>
        <div class="dish-actions">
          <div class="switch-container">
            <span>Disponible</span>
            <label class="switch">
              <input type="checkbox" ${dish.disponible ? 'checked' : ''} onchange="toggleAvailability('${dish.id}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
          <button class="btn-icon" onclick="openDishModal('edit', '${dish.id}', '${escapeHtml(dish.nombre)}', ${dish.precio}, '${escapeHtml(dish.descripcion || '')}', '${escapeHtml(dish.categoria || '')}')">✏️ Editar</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Cambiar disponibilidad en Supabase
  async function toggleAvailability(dishId, isAvailable) {
    await _supabase
      .from('platillos')
      .update({ disponible: isAvailable })
      .eq('id', dishId);
  }

  // Abrir Modal (Agregar / Editar)
  function openDishModal(mode, id = null, name = '', price = '', desc = '', cat = '') {
    const modal = document.getElementById('dishModal');
    const title = document.getElementById('modalTitle');

    modal.classList.add('active');

    if (mode === 'add') {
      title.innerText = "Agregar Nuevo Platillo";
      document.getElementById('dishForm').reset();
      document.getElementById('editDishId').value = "";
    } else {
      title.innerText = "Editar Platillo";
      document.getElementById('editDishId').value = id;
      document.getElementById('modalDishName').value = name;
      document.getElementById('modalDishPrice').value = price;
      document.getElementById('modalDishDesc').value = desc;
      document.getElementById('modalDishCategory').value = cat;
    }
  }

  function closeDishModal() {
    document.getElementById('dishModal').classList.remove('active');
  }

  // Guardar Cambios (INSERT / UPDATE)
  async function saveDish(e) {
    e.preventDefault();
    const btn = document.getElementById('modalSaveBtn');
    btn.disabled = true;
    btn.innerText = "Guardando...";

    const id = document.getElementById('editDishId').value;
    const name = document.getElementById('modalDishName').value;
    const price = parseFloat(document.getElementById('modalDishPrice').value);
    const desc = document.getElementById('modalDishDesc').value;
    const cat = document.getElementById('modalDishCategory').value;

    if (id) {
      // Editar existente en Supabase
      await _supabase
        .from('platillos')
        .update({
          nombre: name,
          precio: price,
          descripcion: desc,
          categoria: cat
        })
        .eq('id', id);
    } else {
      // Crear nuevo en Supabase
      await _supabase
        .from('platillos')
        .insert([{
          restaurante_id: restaurantId,
          nombre: name,
          precio: price,
          descripcion: desc,
          categoria: cat,
          disponible: true
        }]);
    }

    btn.disabled = false;
    btn.innerText = "Guardar Platillo";
    closeDishModal();
    loadDishes();
  }

  function escapeHtml(text) {
    return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
